android {
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    //    def gradleProps = getGradleProperties()
    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
//        versionCode gradleProps['VERSION_CODE'].toInteger()
//        versionName gradleProps['VERSION_NAME']
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'tourguide.tourguide'
    lint {
        abortOnError false
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.appcompat
    implementation libs.floatingactionbutton
}
